<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for Gradients and Shadows -->
  <defs>
    <!-- Gold Gradient for borders and text -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB8" />
      <stop offset="25%" stop-color="#E5C07B" />
      <stop offset="50%" stop-color="#C29646" />
      <stop offset="75%" stop-color="#E5C07B" />
      <stop offset="100%" stop-color="#A37C33" />
    </linearGradient>

    <!-- Light/Glow Gold Gradient for accent and highlight -->
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C29646" />
      <stop offset="50%" stop-color="#FFF3D6" />
      <stop offset="100%" stop-color="#E5C07B" />
    </linearGradient>

    <!-- Drop Shadow for Text -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Deep Burgundy Background Circle -->
  <circle cx="256" cy="256" r="236" fill="#4A0E1B" stroke="url(#goldGradient)" stroke-width="12" />
  
  <!-- Inner Ornamental Thin Circle -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-dasharray="8,6" opacity="0.8" />
  
  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#D4A853" stroke-width="2" opacity="0.3" />

  <!-- Elegant top ornament -->
  <g transform="translate(256, 105) scale(0.65)">
    <path d="M 0,-30 L 7,-10 L 28,-10 L 11,2 L 18,22 L 0,10 L -18,22 L -11,2 L -28,-10 L -7,-10 Z" fill="url(#goldLight)" />
    <circle cx="0" cy="-45" r="5" fill="url(#goldLight)" />
    <path d="M -40,-5 Q 0,-20 40,-5" fill="none" stroke="url(#goldGradient)" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Monogram text -->
  <g filter="url(#shadow)">
    <!-- R (Left) -->
    <text x="175" y="305" 
          font-family="'Playfair Display', 'Cormorant Garamond', 'Didot', 'Georgia', serif" 
          font-size="190" 
          font-weight="700" 
          fill="url(#goldGradient)" 
          text-anchor="middle">R</text>
    
    <!-- Ampersand (Center) -->
    <text x="256" y="275" 
          font-family="'Great Vibes', 'Cormorant Garamond', 'Georgia', 'Times New Roman', serif, cursive" 
          font-size="95" 
          font-weight="300" 
          font-style="italic"
          fill="url(#goldLight)" 
          text-anchor="middle">&amp;</text>
    
    <!-- N (Right) -->
    <text x="335" y="305" 
          font-family="'Playfair Display', 'Cormorant Garamond', 'Didot', 'Georgia', serif" 
          font-size="190" 
          font-weight="700" 
          fill="url(#goldGradient)" 
          text-anchor="middle">N</text>
  </g>

  <!-- Elegant Bottom Floral Scroll / Divider -->
  <g transform="translate(256, 360)">
    <!-- Curved line -->
    <path d="M -100,0 Q 0,35 100,0" fill="none" stroke="url(#goldGradient)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Central Leaf Motifs -->
    <path d="M 0,15 Q -20,25 -25,12 C -20,0 -5,-5 0,15 Z" fill="url(#goldLight)" />
    <path d="M 0,15 Q 20,25 25,12 C 20,0 5,-5 0,15 Z" fill="url(#goldLight)" />
    
    <!-- Small accent dots -->
    <circle cx="0" cy="22" r="4" fill="#FFEBB8" />
    <circle cx="-40" cy="13" r="3" fill="url(#goldGradient)" />
    <circle cx="40" cy="13" r="3" fill="url(#goldGradient)" />
  </g>
</svg>